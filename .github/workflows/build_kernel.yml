name: Build Kernel with KernelSU

on:
  workflow_dispatch:
  push:
    branches:
      - '*'

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex git gnupg gperf \
            libssl-dev libelf-dev lzop rsync zip zlib1g-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Download Neutron Clang Toolchain
        run: |
          mkdir -p clang
          cd clang
          # Use Neutron Clang - proven reliable for Android MediaTek kernel builds
          bash <(curl -s "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") -S=latest
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

      - name: Verify Toolchain
        run: |
          clang --version
          aarch64-linux-gnu-gcc --version

      - name: Setup KernelSU (Manual Integration)
        run: |
          # Clone KernelSU directly into the drivers folder
          git clone --depth=1 https://github.com/tiann/KernelSU drivers/kernelsu

          # Patch drivers/Makefile to include KernelSU
          if ! grep -q "kernelsu" drivers/Makefile; then
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          fi

          # Patch drivers/Kconfig to include KernelSU's Kconfig
          if ! grep -q "kernelsu" drivers/Kconfig; then
            sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          fi

          # Enable KernelSU in the defconfig
          echo "CONFIG_KSU=y" >> arch/arm64/configs/cyllene_defconfig

      - name: Fix Missing Proprietary Kconfig and Makefile Stubs
        run: |
          python3 << 'PYEOF'
          import os, re

          kconfig_stub = "# Stub Kconfig - OPlus proprietary feature not in public source\n"
          makefile_stub = "# Stub Makefile - OPlus proprietary feature not in public source\n"

          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ['.git', 'clang', 'out']]

              # --- Stub missing Kconfig source references ---
              for fname in files:
                  if 'Kconfig' not in fname:
                      continue
                  kfile = os.path.join(root, fname)
                  try:
                      with open(kfile, 'r', errors='ignore') as f:
                          content = f.read()
                      refs = re.findall(r'source\s+"([^"]+)"', content)
                      refs += re.findall(r'source\s+([^"\s][^\s]*Kconfig[^\s]*)', content)
                      for ref in refs:
                          if not os.path.isfile(ref):
                              print(f"Stubbing Kconfig: {ref}")
                              parent = os.path.dirname(ref) or '.'
                              if os.path.exists(parent) and not os.path.isdir(parent):
                                  os.remove(parent)
                              elif os.path.islink(parent):
                                  os.unlink(parent)
                              os.makedirs(parent, exist_ok=True)
                              with open(ref, 'w') as stub:
                                  stub.write(kconfig_stub)
                  except Exception as e:
                      print(f"Warning Kconfig {kfile}: {e}")

              # --- Stub missing Makefile subdirectories ---
              for fname in ['Makefile', 'Kbuild']:
                  if fname not in files:
                      continue
                  mkfile = os.path.join(root, fname)
                  try:
                      with open(mkfile, 'r', errors='ignore') as f:
                          content = f.read()
                      # Match: obj-y += subdir/ or obj-$(CONFIG_X) += subdir/
                      for subdir in re.findall(r'obj-[^\s]+\s*\+=\s*([a-zA-Z0-9_\-]+)/', content):
                          subdir_path = os.path.join(root, subdir)
                          if not os.path.isdir(subdir_path):
                              print(f"Stubbing Makefile dir: {subdir_path}")
                              os.makedirs(subdir_path, exist_ok=True)
                              with open(os.path.join(subdir_path, 'Makefile'), 'w') as stub:
                                  stub.write(makefile_stub)
                  except Exception as e:
                      print(f"Warning Makefile {mkfile}: {e}")
          PYEOF

      - name: Build Kernel
        run: |
          set -x
          # Use yes to auto-accept any NEW config prompts
          yes "" | make O=out ARCH=arm64 cyllene_defconfig

          make O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LLVM=1 \
            LLVM_IAS=1 \
            -j$(nproc)

      - name: Upload Image.gz
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Image-cyllene
          path: out/arch/arm64/boot/Image.gz
